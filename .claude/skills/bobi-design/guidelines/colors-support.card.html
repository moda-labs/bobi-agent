<!-- @dsCard group="Colors" viewport="700x150" subtitle="Highlight, rare support, and the one cool surface" name="Clay, sky & terminal" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:14px">
<div class="sw"><div class="chip" style="background:#D67B55"></div><span class="lb">clay</span><span class="hx" style="font-size:9.5px">#D67B55</span><span class="lb" style="opacity:.7">highlight</span></div><div class="sw"><div class="chip" style="background:#7DAABD"></div><span class="lb">sky</span><span class="hx" style="font-size:9.5px">#7DAABD</span><span class="lb" style="opacity:.7">rare</span></div><div class="sw"><div class="chip" style="background:#0F1226"></div><span class="lb">term-bg</span><span class="hx" style="font-size:9.5px">#0F1226</span><span class="lb" style="opacity:.7">shell</span></div><div class="sw"><div class="chip" style="background:oklch(.78 .10 65)"></div><span class="lb">term-ok</span><span class="hx" style="font-size:9.5px">oklch(.78 .10 65)</span><span class="lb" style="opacity:.7">success</span></div><div class="sw"><div class="chip" style="background:#1A1D33"></div><span class="lb">night</span><span class="hx" style="font-size:9.5px">#1A1D33</span><span class="lb" style="opacity:.7">hero sky</span></div>
<div style="padding-left:6px;max-width:190px"><p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--bobi-muted)">Clay carries headline highlights and indices. <strong style="color:var(--bobi-ink);font-weight:500">#0F1226</strong> is the only cool-dark surface — shell output only.</p></div>
</div>
</body></html>
