<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:26px">
<div style="display:flex;align-items:center;justify-content:center;width:96px;height:96px;background:var(--bobi-void);border-radius:22px"><svg viewBox="0 0 32 32" width="60" height="60"><circle cx="14" cy="18" r="6" fill="#FAF7EE"/><circle cx="14" cy="18" r="12.5" fill="none" stroke="#FAF7EE" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/><circle cx="23.5" cy="9.5" r="3" fill="var(--bobi-acc-bright)"/></svg></div>
<svg viewBox="0 0 32 32" width="64" height="64"><circle cx="14" cy="18" r="6" fill="var(--bobi-ink)"/><circle cx="14" cy="18" r="12.5" fill="none" stroke="var(--bobi-ink)" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/><circle cx="23.5" cy="9.5" r="3" fill="var(--bobi-acc)"/></svg>
<span style="font-size:38px;display:inline-flex;align-items:center;gap:.32em"><svg viewBox="0 0 32 32" style="width:.62em;height:.62em"><circle cx="14" cy="18" r="6" fill="var(--bobi-ink)"/><circle cx="14" cy="18" r="12.5" fill="none" stroke="var(--bobi-ink)" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/><circle cx="23.5" cy="9.5" r="3" fill="var(--bobi-acc)"/></svg><span style="font-family:var(--font-display);font-weight:600;line-height:1;letter-spacing:-.045em;color:var(--bobi-ink)">bobi</span></span>
<p style="margin:0;max-width:150px;font-size:12px;line-height:1.5;color:var(--bobi-muted)">Chip for icons, bare on paper, lockup in chrome.</p>
</div>
</body></html>
