<!-- @dsCard group="Components" viewport="700x260" subtitle="Button variants, file chips, badge tones" name="Core — buttons, eyebrow, chips, badges" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:16px">
<div class="r" style="gap:10px">
<button style="display:inline-flex;align-items:center;gap:9px;padding:12px 26px;border:none;border-radius:6px;background:var(--bobi-acc);color:var(--bobi-paper);font-family:var(--font-sans);font-size:15px;font-weight:500;letter-spacing:-.01em">View on GitHub</button>
<button style="padding:12px 26px;border:none;border-radius:6px;background:var(--bobi-paper-alt);color:var(--bobi-ink);font-family:var(--font-sans);font-size:15px;font-weight:500;letter-spacing:-.01em">Quiet</button>
<button style="padding:12px 26px;border-radius:6px;border:1px solid var(--border-strong);background:transparent;color:var(--bobi-ink);font-family:var(--font-sans);font-size:15px;font-weight:500;letter-spacing:-.01em">Ghost</button>
<button style="padding:12px 26px;border:none;border-radius:6px;background:var(--bobi-acc);color:var(--bobi-paper);font-family:var(--font-sans);font-size:15px;font-weight:500;opacity:.45">Disabled</button>
</div>
<div style="padding:10px 14px;background:var(--bobi-void);border-radius:6px;display:inline-flex;gap:10px;width:fit-content">
<span style="display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:6px;background:var(--bobi-paper);color:var(--bobi-ink);font-family:var(--font-sans);font-size:14px;font-weight:500">Inverse</span>
<span style="display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:6px;background:rgba(250,247,238,.08);border:1px solid rgba(250,247,238,.18);color:var(--bobi-paper);font-family:var(--font-sans);font-size:14px;font-weight:500">Glass</span>
</div>
<span style="font-family:var(--font-mono);font-size:14px;font-weight:500;letter-spacing:-.03em;color:var(--bobi-muted);display:flex;align-items:center"><span style="width:10px;height:10px;background:var(--bobi-clay);margin-right:8px"></span>WHAT&rsquo;S SPECIAL ABOUT BOBI?</span>
<div class="r" style="gap:8px">
<span style="display:inline-flex;align-items:baseline;padding:0 8px 1px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bobi-paper);font-family:var(--font-mono);font-size:12.5px;color:var(--bobi-ink)">agent.yaml</span><span style="display:inline-flex;align-items:baseline;padding:0 8px 1px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bobi-paper);font-family:var(--font-mono);font-size:12.5px;color:var(--bobi-ink)">workflows/</span><span style="display:inline-flex;align-items:baseline;padding:0 8px 1px;border:1px solid var(--border-gate);border-radius:6px;background:var(--bobi-paper);font-family:var(--font-mono);font-size:12.5px;color:var(--bobi-acc)">support-triage.yaml</span>
<span style="display:inline-flex;padding:4px 9px;border-radius:6px;background:var(--bobi-acc-wash);font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bobi-acc)">Enforced</span><span style="display:inline-flex;padding:4px 9px;border-radius:6px;background:color-mix(in srgb,var(--bobi-clay) 10%,transparent);font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bobi-clay)">Engineering</span><span style="display:inline-flex;padding:4px 9px;border-radius:6px;background:var(--bobi-paper-alt);font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bobi-muted)">generated</span>
</div>
</div>
</body></html>
