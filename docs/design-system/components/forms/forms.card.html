<!-- @dsCard group="Components" viewport="700x250" subtitle="Mono fields, violet focus, 6px switch track" name="Forms — input, select, switch" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div style="display:flex;gap:20px;flex-wrap:wrap">
<label style="display:block;width:210px"><span class="lb" style="display:block;margin-bottom:6px">Agent name</span><span style="display:flex;align-items:center;padding:0 12px;background:var(--bobi-paper);border:1px solid var(--border-strong);border-radius:6px"><input value="my-agent" style="flex:1;min-width:0;padding:10px 0;border:none;outline:none;background:transparent;font-family:var(--font-mono);font-size:13.5px;color:var(--bobi-ink)"></span><span style="display:block;margin-top:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--bobi-muted)">lowercase, no spaces</span></label>
<label style="display:block;width:250px"><span class="lb" style="display:block;margin-bottom:6px">Command</span><span style="display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bobi-paper);border:1px solid var(--bobi-acc);border-radius:6px;outline:2px solid var(--bobi-acc);outline-offset:2px"><span style="font-family:var(--font-mono);font-size:13px;color:var(--bobi-acc)">$</span><input value="bobi agent my-agent start" style="flex:1;min-width:0;padding:10px 0;border:none;outline:none;background:transparent;font-family:var(--font-mono);font-size:13.5px;color:var(--bobi-ink)"></span><span style="display:block;margin-top:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--bobi-muted)">focus state</span></label>
<label style="display:block;width:180px"><span class="lb" style="display:block;margin-bottom:6px">Runtime</span><span style="display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 12px;background:var(--bobi-paper);border:1px solid var(--border-strong);border-radius:6px;font-family:var(--font-mono);font-size:13.5px;color:var(--bobi-ink)">claude-code<svg viewBox="0 0 20 20" width="16" height="16" fill="none" style="color:var(--bobi-muted)"><path d="M6 8.5 10 12.5 14 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></label>
<div style="display:flex;flex-direction:column;gap:12px;padding-top:22px">
<span style="display:flex;align-items:center;gap:12px"><span style="position:relative;width:38px;height:22px;flex-shrink:0;border:1px solid var(--bobi-acc);border-radius:6px;background:var(--bobi-acc)"><span style="position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:4px;background:var(--bobi-paper);box-shadow:0 1px 3px rgba(54,46,37,.25)"></span></span><span><span style="display:block;font-size:14px;font-weight:500;color:var(--bobi-ink)">stale-pr-check</span><span style="display:block;margin-top:2px;font-family:var(--font-mono);font-size:11.5px;color:var(--bobi-muted)">every 1h · nudge after 48h</span></span></span><span style="display:flex;align-items:center;gap:12px"><span style="position:relative;width:38px;height:22px;flex-shrink:0;border:1px solid var(--border-strong);border-radius:6px;background:var(--bobi-paper-alt)"><span style="position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:4px;background:var(--bobi-paper);box-shadow:0 1px 3px rgba(54,46,37,.25)"></span></span><span><span style="display:block;font-size:14px;font-weight:500;color:var(--bobi-ink)">morning-review</span><span style="display:block;margin-top:2px;font-family:var(--font-mono);font-size:11.5px;color:var(--bobi-muted)">cron 07:00</span></span></span>
</div>
</div>
</body></html>
