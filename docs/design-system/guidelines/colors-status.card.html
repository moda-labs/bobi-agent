<!-- @dsCard group="Colors" viewport="700x150" subtitle="Fixed state colors for product UI" name="Status mapping" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:26px">
<div style="display:flex;flex-direction:column;gap:5px"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--status-live)"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-live)"></span>live</span><span class="lb" style="opacity:.75">system working</span></div><div style="display:flex;flex-direction:column;gap:5px"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--status-waiting)"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-waiting)"></span>waiting</span><span class="lb" style="opacity:.75">person is blocker</span></div><div style="display:flex;flex-direction:column;gap:5px"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--status-done)"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-done)"></span>done</span><span class="lb" style="opacity:.75">complete</span></div><div style="display:flex;flex-direction:column;gap:5px"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--status-idle)"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-idle)"></span>idle</span><span class="lb" style="opacity:.75">nothing to do</span></div><div style="display:flex;flex-direction:column;gap:5px"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--status-failed)"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-failed)"></span>failed</span><span class="lb" style="opacity:.75">halted</span></div>
</div>
</body></html>
