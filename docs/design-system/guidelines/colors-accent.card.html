<!-- @dsCard group="Colors" viewport="700x150" subtitle="The one token that makes Moda into Bobi" name="Accent — dusk violet" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:18px">
<div class="sw"><div class="chip" style="background:var(--bobi-acc);width:120px;height:60px"></div><span class="lb">acc</span><span class="hx">oklch(.53 .17 285)</span></div>
<div class="sw"><div class="chip" style="background:var(--bobi-acc-bright);width:120px;height:60px"></div><span class="lb">acc-bright</span><span class="hx">oklch(.70 .14 285)</span></div>
<div class="sw"><div class="chip" style="background:var(--bobi-acc-wash);width:92px;height:60px"></div><span class="lb">wash 5%</span><span class="hx">gate fill</span></div>
<div class="sw"><div class="chip" style="background:transparent;border:1px solid var(--border-gate);width:92px;height:60px"></div><span class="lb">border 55%</span><span class="hx">gate edge</span></div>
<div style="padding-left:8px;max-width:200px"><p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--bobi-muted)">Violet means <strong style="color:var(--bobi-ink);font-weight:500">state</strong>: live, enforced, gated. Moda's red never appears on a Bobi surface.</p></div>
</div>
</body></html>
