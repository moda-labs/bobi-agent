<!-- @dsCard group="Colors" viewport="700x150" subtitle="The warm editorial base, inherited from Moda Labs" name="Paper & ink" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:14px">
<div class="sw"><div class="chip" style="background:#FAF7EE"></div><span class="lb">paper</span><span class="hx">#FAF7EE</span><span class="lb" style="opacity:.7">canvas</span></div><div class="sw"><div class="chip" style="background:#EAE4D1"></div><span class="lb">paper-alt</span><span class="hx">#EAE4D1</span><span class="lb" style="opacity:.7">band</span></div><div class="sw"><div class="chip" style="background:#E5DED6"></div><span class="lb">rule</span><span class="hx">#E5DED6</span><span class="lb" style="opacity:.7">hairline</span></div><div class="sw"><div class="chip" style="background:#84725B"></div><span class="lb">muted</span><span class="hx">#84725B</span><span class="lb" style="opacity:.7">2nd text</span></div><div class="sw"><div class="chip" style="background:#362E25"></div><span class="lb">ink</span><span class="hx">#362E25</span><span class="lb" style="opacity:.7">text</span></div><div class="sw"><div class="chip" style="background:#221C15"></div><span class="lb">void</span><span class="hx">#221C15</span><span class="lb" style="opacity:.7">dark</span></div>
</div>
</body></html>
