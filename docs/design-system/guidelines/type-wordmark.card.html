<!-- @dsCard group="Type" viewport="700x150" subtitle="The lockup sets tighter than anything else" name="Wordmark tracking" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bobi-paper);font-family:var(--font-sans)}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:74px;height:46px;border-radius:6px;border:1px solid rgba(54,46,37,0.12)}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bobi-muted)}.hx{font-family:var(--font-mono);font-size:10.5px;color:var(--bobi-ink)}</style>
</head><body>
<div class="r" style="gap:30px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--font-display);font-weight:600;font-size:52px;letter-spacing:-.045em;color:var(--bobi-ink);line-height:1">bobi</span><span class="lb">-0.045em · lockup only</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--font-display);font-weight:600;font-size:52px;letter-spacing:-.03em;color:rgba(54,46,37,.35);line-height:1">bobi</span><span class="lb" style="opacity:.7">-0.03em · too loose</span></div>
<p style="margin:0;max-width:190px;font-size:12.5px;line-height:1.5;color:var(--bobi-muted)">Always lowercase in a lockup. Body copy may write “Bobi” as a sentence subject.</p>
</div>
</body></html>
