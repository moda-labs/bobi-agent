# Codex CLI dependency (#428 unified model; was #416 kind: cli).
# `success` is the verifiable contract (build-success under
# BOBI_VERIFY_PHASE=build, runtime-success otherwise); `install` is the
# pinned recipe. The pin lives here ONCE; compose's build de-dupe
# collapses any repeat across `from:` layers.
#
# Both recipes honour $CODEX_HOME (#958): the entrypoint points codex's config
# dir at the durable volume on every brain, so a literal ~/.codex here would
# read the wrong directory and fail closed. They also skip the api-key write
# when a usable OAuth credential is present, so a preflight cannot clobber a
# credential a human minted via `login-bootstrap codex`.
#
# The subscription branch below keeps its own NARROW predicate rather than
# reusing `credential-status`: it asks "is this a recognized API-key file",
# and anything it cannot classify falls through to a real `codex exec`, which
# is a functional answer rather than a structural guess. Widening it to "fail
# on anything credential-status rejects" is the same over-reach D8 refuses
# for the boot sweep, and tests/test_tool_library.py pins the difference.
success: 'command -v codex >/dev/null 2>&1 && { CODEX_DIR="${CODEX_HOME:-$HOME/.codex}"; if { [ "${BOBI_BRAIN:-}" = "codex" ] || [ "${BOBI_BRAIN:-}" = "gateway-openai" ]; } && [ -n "${BOBI_GATEWAY_BASE_URL:-}" ]; then python3 -c ''import re, subprocess, sys; out=subprocess.check_output(["codex", "--version"], text=True); m=re.search(r"(\d+)\.(\d+)\.(\d+)", out); sys.exit(0 if m and tuple(map(int, m.groups())) >= (0, 144, 4) else 1)''; elif [ "${BOBI_AUTH:-api_key}" != "subscription" ] && [ -n "${OPENAI_API_KEY:-}" ] && ! python3 -m bobi.auth_bootstrap credential-status codex "${CODEX_DIR}/auth.json" >/dev/null 2>&1; then mkdir -p "${CODEX_DIR}" && CODEX_DIR="${CODEX_DIR}" python3 -c ''import json, os, pathlib; p=pathlib.Path(os.environ["CODEX_DIR"])/"auth.json"; p.write_text(json.dumps({"OPENAI_API_KEY": os.environ["OPENAI_API_KEY"]})+"\n"); p.chmod(0o600)''; fi; if { [ "${BOBI_BRAIN:-}" = "codex" ] || [ "${BOBI_BRAIN:-}" = "gateway-openai" ]; } && [ -n "${BOBI_GATEWAY_BASE_URL:-}" ]; then true; elif [ -f "${CODEX_DIR}/auth.json" ]; then if [ "${BOBI_AUTH:-api_key}" = "subscription" ] && CODEX_DIR="${CODEX_DIR}" python3 -c ''import json, os, pathlib, sys; p=pathlib.Path(os.environ["CODEX_DIR"])/"auth.json"; data=json.loads(p.read_text()); sys.exit(0 if isinstance(data, dict) and data.get("OPENAI_API_KEY") and not data.get("tokens") else 1)''; then false; else python3 -c ''import subprocess, sys; sys.exit(subprocess.run(["codex", "exec", "-s", "read-only", "--skip-git-repo-check", "reply OK"], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, timeout=8).returncode)''; fi; elif [ "${BOBI_VERIFY_PHASE:-}" = "build" ]; then codex --version >/dev/null 2>&1; else false; fi; }'
why: Delegate a coding sub-task to the Codex CLI (tools/codex.md).
fix: 'npm install -g @openai/codex@0.144.4 && { CODEX_DIR="${CODEX_HOME:-$HOME/.codex}"; if { [ "${BOBI_BRAIN:-}" = "codex" ] || [ "${BOBI_BRAIN:-}" = "gateway-openai" ]; } && [ -n "${BOBI_GATEWAY_BASE_URL:-}" ]; then codex --version >/dev/null 2>&1; elif python3 -m bobi.auth_bootstrap credential-status codex "${CODEX_DIR}/auth.json" >/dev/null 2>&1; then true; elif [ "${BOBI_AUTH:-api_key}" != "subscription" ] && [ -n "${OPENAI_API_KEY:-}" ]; then mkdir -p "${CODEX_DIR}" && CODEX_DIR="${CODEX_DIR}" python3 -c ''import json, os, pathlib; p=pathlib.Path(os.environ["CODEX_DIR"])/"auth.json"; p.write_text(json.dumps({"OPENAI_API_KEY": os.environ["OPENAI_API_KEY"]})+"\n"); p.chmod(0o600)''; else codex auth login || echo ''Set OPENAI_API_KEY in run/.env, or log in over chat with `bobi agent <name> login-bootstrap codex`''; fi; }'
install:
  apt:
  - nodejs
  - npm
  npm:
  - '@openai/codex@0.144.4'
