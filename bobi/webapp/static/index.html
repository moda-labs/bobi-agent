<!DOCTYPE html>
<html lang="en" data-retro="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="bobi-webui-token" content="{{TOKEN}}">
  <title>bobi</title>
  <link rel="icon" type="image/svg+xml" href="/static/bobi-mark.svg">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
  <!-- The same titlebar the setup app renders: window dots, the address
       chip, and the probe mark on the right. Setup mounts inside this app
       as a real page (never an iframe), so the chrome has to be the same
       chrome or crossing between them reads as leaving the product. -->
  <header class="titlebar">
    <div class="tdots"><i></i><i></i><i></i></div>
    <div class="addr" id="addr"></div>
    <div class="spacer"></div>
    <span class="dot" id="health" title="connection"></span>
    <a class="brand" href="#/" title="Go to dashboard" aria-label="Dashboard">
      <span class="mk"><svg viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(2,-2)"><circle cx="14" cy="18" r="6" fill="#FAF7EE"/><circle cx="14" cy="18" r="12.5" fill="none" stroke="#FAF7EE" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"/><circle cx="23.5" cy="9.5" r="3" fill="#9690F1"/></g></svg></span>
      <b>bobi</b>
    </a>
  </header>

  <main id="view" class="view"></main>
  </div>

  <div id="gone" class="gone" hidden>
    <p>The app server stopped. Restart it with <code>bobi app start</code>.</p>
  </div>

  <script type="module" src="/static/shell.js"></script>
</body>
</html>
