<!DOCTYPE html>
<html lang="en" data-retro="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="bobi-webui-token" content="{{TOKEN}}">
  <title>bobi</title>
  <link rel="icon" type="image/svg+xml" href="/static/bobi-mark.svg">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<!-- .bobi-app switches on the product surface ramp (sunken page, white cards,
     elevation scale) from tokens.css. Marketing surfaces never get it. -->
<body class="bobi-app">
  <div class="app">
  <header class="bar">
    <!-- The lockup always travels with the BY MODA LABS byline. -->
    <a class="mark home-link" href="#/" aria-label="Dashboard">
      <!-- On light chrome the mark is ink with a violet probe dot; the
           paper-on-void variant is for dark surfaces only. -->
      <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
        <circle cx="14" cy="18" r="6" fill="var(--bobi-ink)"></circle>
        <circle cx="14" cy="18" r="12.5" fill="none" stroke="var(--bobi-ink)"
                stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"></circle>
        <circle cx="23.5" cy="9.5" r="3" fill="var(--bobi-acc)"></circle>
      </svg>
    </a>
    <span class="title">bobi</span>
    <a class="byline" href="https://buildmoda.ai" target="_blank" rel="noopener noreferrer">by moda labs <span aria-hidden="true">&#8599;</span></a>
    <span class="sub" id="subtitle">agents</span>
    <span class="spacer"></span>
    <span class="dot" id="health" title="connection"></span>
  </header>

  <main id="view" class="view"></main>
  </div>

  <div id="gone" class="gone" hidden>
    <p>The app server stopped. Restart it with <code>bobi app start</code>.</p>
  </div>

  <script type="module" src="/static/shell.js"></script>
</body>
</html>
