<!DOCTYPE html>
<html lang="en" data-retro="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="bobi-nonce" content="{{NONCE}}" />
  <meta name="bobi-base" content="{{BASE}}" />
  <title>bobi setup</title>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/static/bobi-mark.svg" />
  <link rel="stylesheet" href="{{BASE}}/static/fonts.css" />
  <link rel="stylesheet" href="{{BASE}}/static/tokens.css" />
  <link rel="stylesheet" href="{{BASE}}/static/app.css" />
</head>
<!-- .bobi-app switches on the product surface ramp (sunken page, white cards,
     elevation scale) from tokens.css. Marketing surfaces never get it. -->
<body class="bobi-app">
  <div class="app">
    <!-- Real app chrome, full-bleed: the browser IS the window, so there is no
         simulated title bar, traffic lights, or address chip. `.addr` is a nav
         slot — when setup is hosted inside `bobi app` it becomes the
         back-to-dashboard link (see app.js). -->
    <header class="titlebar">
      <div class="addr"></div>
      <div class="spacer"></div>
      <!-- The lockup always travels with the BY MODA LABS byline. -->
      <div class="lockup">
        <button class="brand" type="button" data-home title="Go to homepage" aria-label="Go to homepage">
          <span class="mk"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="18" r="6" fill="var(--bobi-paper)"/><circle cx="14" cy="18" r="12.5" fill="none" stroke="var(--bobi-paper)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"/><circle cx="23.5" cy="9.5" r="3" fill="var(--bobi-acc-bright)"/></svg></span>
          <b>bobi</b>
        </button>
        <a class="byline" href="https://buildmoda.ai" target="_blank" rel="noopener noreferrer">by moda labs <span aria-hidden="true">&#8599;</span></a>
      </div>
    </header>
    <div class="panes" id="panes">
      <div id="main" style="display:contents"></div>
    </div>
  </div>
  <script src="{{BASE}}/static/app.js"></script>
</body>
</html>
