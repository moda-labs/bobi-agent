name: pr-closed
trigger: When a pull request is closed (merged or unmerged).
description: >
  Deterministic post-close cleanup. The cleanup step re-reads the PR's merge
  state from GitHub and removes the worktree and branch only when that live
  read says the PR merged; a PR closed without merging keeps both, because
  its head is the only copy of the work. If merged, also closes the linked
  issue.

steps:
  # Self-gating (#1004). cleanup_worktree cannot delete without a merge
  # verdict, and this action reads that verdict live rather than trusting
  # input.merged - the webhook snapshot, already stale by the time the run
  # starts. It publishes what it acted on as `merged_live`.
  - name: cleanup
    action: cleanup_worktree
    timeout: 120

  # Routes on the verdict the cleanup step actually used, so the branch below
  # can never disagree with what happened on disk above.
  - name: route-merged
    if: "merged_live == true"
    goto: close-issue
    else: done

  - name: close-issue
    agent: engineer
    prompt: |
      PR #${{ input.pr_number }} in ${{ input.repo }} was merged.
      Close the linked issue with a comment referencing the PR.
      If no linked issue can be determined, skip gracefully.
    handoff:
      required: [status]
    timeout: 300

  - name: done
    notify: slack
    message: >-
      PR #${{ input.pr_number }} closed (merged=${{ cleanup.merged_live }}).
      Branch ${{ input.head_branch }}: ${{ cleanup.status }}.
      ${{ cleanup.reason }}
