name: Container image

# Builds the reference instance image and runs its contract tests.
#
# Path-filtered: only fires when image-defining files change, so unrelated PRs
# pay nothing. The nightly run has no path filter — it catches EXTERNAL rot
# (the claude.ai installer, the python:3.11-slim base, apt/pip indexes) even
# when no file in the repo changed.
#
# This workflow came from the private deploy repo with the image itself
# (repo reorg, Phase 6). Two things fell away in the move, both because the
# image recipe now lives in the same repo as the source it installs:
#   * the `setup-public-bobi` composite action — a sibling checkout of this
#     repo, needed only to give the private context a bobi source tree;
#   * the private-only steps (`bobi build` integration, the dependency-bootstrap
#     e2e) — they drive `scripts/build-team-images.sh` and the `bobi_deploy`
#     engine, which stay private and move to moda-agents in Phase 7.
# The path filter also regains the public-source triggers that the repo split
# had to drop, since those files are finally in this repo again.
on:
  push:
    branches: [main]
    paths: &image_paths
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "tests/integration/test_container_image.py"
      - ".github/workflows/container.yml"
      # Regained at the reorg: the public inputs that define what the image
      # installs. Under the split these lived in another repo and could not
      # path-trigger; the nightly cron was the only backstop for that rot.
      - "pyproject.toml"
      - "hatch_build.py"
      - "bobi/cli.py"
      - "bobi/registry.py"
      - "bobi/build.py"
      - "bobi/build_render.py"
      - "bobi/tool_library.py"
      - "bobi/dep_bootstrap.py"
      - "bobi/supervisor/**"
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so adding the `ci:live` label triggers a run that
    # includes the live-gated steps (default types don't fire on labels).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: *image_paths
  schedule:
    - cron: "0 6 * * *"  # nightly at 6am UTC — external-rot canary
  workflow_dispatch: {}

jobs:
  image-lint:
    name: Lint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Dockerfile build-check (wheel + pypi modes)
        # BuildKit lint + stage-graph resolution for both SHIPPABLE build modes,
        # so a regression in either is caught without a full image build.
        #
        # `--check` resolves the stage graph and lints; it does NOT execute RUN
        # steps, so it cannot prove a mode actually builds. That is what the
        # wheel-mode build below is for.
        run: |
          docker build --check --build-arg BOBI_BUILD=wheel .
          docker build --check --build-arg BOBI_BUILD=pypi --build-arg BOBI_VERSION=0.0.0 .

  container-image:
    name: Build + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 20 EXACTLY, and it must not be raised. `pip install -e .` below
      # runs hatch_build.py, which builds the embedded event server and requires
      # major version 20 (`_require_build_node`); the runner's default is 22,
      # which it rejects outright:
      #
      #   EventServerBuildError: Node.js 20 is required to build the embedded
      #   event server; found 'v22.23.1'
      #
      # This job never touches wrangler (which conversely refuses anything below
      # 22), so the two requirements do not collide here. They cannot share a
      # job anywhere — see the Worker protocol suite in ci.yml, which pins 22.
      #
      # Absent this pin the job fails on a green tree, which is what it did
      # nightly in the private deploy repo from 2026-07-28 until this move.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The contract tests import bobi (they shell out to docker, but the
      # package must be importable on the runner).
      - name: Install test runner
        run: pip install -e ".[dev]"

      # Wheel mode, not the Dockerfile's nominal `source` default. Source mode
      # cannot build in ANY repo: .dockerignore drops both `.git` and
      # `event-server/dist`, so hatch_build.py's `initialize` finds neither a
      # VCS checkout nor a prebuilt artifact and takes the rebuild path — which
      # needs Node inside `python:3.11-slim`, where there is none. Building the
      # wheel here on the pinned Node 20 and installing THAT is the mode the
      # release pipeline uses, so CI exercises the shipped path.
      - name: Build the wheel into the build context
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - name: Build instance image
        run: docker build --build-arg BOBI_BUILD=wheel -t bobi:ci .

      - name: Run container contract tests
        # The image is prebuilt above; the fixture reuses it via the env var
        # instead of rebuilding. Contract checks only.
        env:
          BOBI_TEST_IMAGE: bobi:ci
        run: pytest tests/integration/test_container_image.py -m "docker and not live" -v --timeout=400
