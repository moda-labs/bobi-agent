name: Container image

# Builds the reference instance image and runs its contract tests.
#
# Path-filtered: only fires when image-defining files change, so unrelated PRs
# pay nothing. The nightly run has no path filter — it catches EXTERNAL rot
# (the claude.ai installer, the python:3.11-slim base, apt/pip indexes) even
# when no file in the repo changed.
#
# This workflow came from the private deploy repo with the image itself
# (repo reorg, Phase 6). Two things fell away in the move, both because the
# image recipe now lives in the same repo as the source it installs:
#   * the `setup-public-bobi` composite action — a sibling checkout of this
#     repo, needed only to give the private context a bobi source tree;
#   * the private-only steps (`bobi build` integration, the dependency-bootstrap
#     e2e) — they drive `scripts/build-team-images.sh` and the `bobi_deploy`
#     engine, which stay private and move to moda-agents in Phase 7.
# The path filter also regains the public-source triggers that the repo split
# had to drop, since those files are finally in this repo again.
on:
  push:
    branches: [main]
    paths: &image_paths
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "tests/integration/test_container_image.py"
      - ".github/workflows/container.yml"
      # Regained at the reorg: the public inputs that define what the image
      # installs. Under the split these lived in another repo and could not
      # path-trigger; the nightly cron was the only backstop for that rot.
      - "pyproject.toml"
      - "hatch_build.py"
      - "bobi/cli.py"
      - "bobi/registry.py"
      - "bobi/build.py"
      - "bobi/build_render.py"
      # `bobi/tool_library/**`, not the old `bobi/tool_library.py`: the module
      # moved into the package it used to shadow. A stale `.py` filter here
      # would match nothing and silently stop triggering this lane - the #909
      # vacuous-lane shape the note above warns about. The glob also newly
      # covers the catalog entries themselves (`codex/tool.yaml` et al), which
      # is a deliberate widening: those pins bake INTO the image (#486), so a
      # version bump there is exactly an image change.
      - "bobi/tool_library/**"
      - "bobi/dep_bootstrap.py"
      - "bobi/supervisor/**"
      # The OTLP exporter and its collector proof (#978). Without these four
      # the lane fires on the PR that adds them (`pyproject.toml` and
      # `bobi/cli.py` are already listed) and never again on an exporter
      # change - the #909 vacuous-lane shape exactly.
      - "bobi/otel/**"
      - "bobi/http.py"
      - "bobi/identity.py"
      - "tests/integration/test_otel_collector.py"
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so adding the `ci:live` label triggers a run that
    # includes the live-gated steps (default types don't fire on labels).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: *image_paths
  schedule:
    - cron: "0 6 * * *"  # nightly at 6am UTC — external-rot canary
  workflow_dispatch: {}

jobs:
  image-lint:
    name: Lint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Dockerfile build-check (wheel + pypi modes)
        # BuildKit lint + stage-graph resolution for both SHIPPABLE build modes,
        # so a regression in either is caught without a full image build.
        #
        # `--check` resolves the stage graph and lints; it does NOT execute RUN
        # steps, so it cannot prove a mode actually builds. That is what the
        # wheel-mode build below is for.
        run: |
          docker build --check --build-arg BOBI_BUILD=wheel .
          docker build --check --build-arg BOBI_BUILD=pypi --build-arg BOBI_VERSION=0.0.0 .

  container-image:
    name: Build + contract tests
    runs-on: ubuntu-latest
    # The live round-trips below are allowed 600s each by their own timeout
    # marks, on top of a wheel build and an image build. Bound the job so a
    # wedged brain call cannot burn a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Node 20 EXACTLY, and it must not be raised. `pip install -e .` below
      # runs hatch_build.py, which builds the embedded event server and requires
      # major version 20 (`_require_build_node`); the runner's default is 22,
      # which it rejects outright:
      #
      #   EventServerBuildError: Node.js 20 is required to build the embedded
      #   event server; found 'v22.23.1'
      #
      # This job never touches wrangler (which conversely refuses anything below
      # 22), so the two requirements do not collide here. They cannot share a
      # job anywhere — see the Worker protocol suite in ci.yml, which pins 22.
      #
      # Absent this pin the job fails on a green tree, which is what it did
      # nightly in the private deploy repo from 2026-07-28 until this move.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The contract tests import bobi (they shell out to docker, but the
      # package must be importable on the runner).
      - name: Install test runner
        run: pip install -e ".[dev]"

      # Wheel mode, not the Dockerfile's nominal `source` default. Source mode
      # cannot build in ANY repo: .dockerignore drops both `.git` and
      # `event-server/dist`, so hatch_build.py's `initialize` finds neither a
      # VCS checkout nor a prebuilt artifact and takes the rebuild path — which
      # needs Node inside `python:3.11-slim`, where there is none. Building the
      # wheel here on the pinned Node 20 and installing THAT is the mode the
      # release pipeline uses, so CI exercises the shipped path.
      - name: Build the wheel into the build context
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - name: Build instance image
        run: docker build --build-arg BOBI_BUILD=wheel -t bobi:ci .

      - name: Run container contract tests
        # The image is prebuilt above; the fixture reuses it via the env var
        # instead of rebuilding. Contract checks only.
        env:
          BOBI_TEST_IMAGE: bobi:ci
        run: pytest tests/integration/test_container_image.py -m "docker and not live" -v --timeout=400

      # ------------------------------------------------------------------
      # OTLP COLLECTOR LANE (#978). The acceptance bar for the otel exporter
      # is a REAL collector: a protobuf round-trip that encodes and decodes
      # with the same wrong message type passes while the wire shape is wrong,
      # which is exactly the error this feature's own plan review caught.
      #
      # It lives here rather than in `integration-fast` because the suite is
      # `docker`-marked, and that job deselects the marker — an unhomed
      # container test is a third vacuous surface.
      #
      # No credentials, no spend: a public collector image with a `debug`
      # exporter, so unlike the live lane below it runs on every push.
      - name: Run the OTLP collector round-trip
        run: |
          pytest tests/integration/test_otel_collector.py \
            -m docker -v --timeout=300 \
            --junitxml=otel-collector.xml

      - name: Assert the collector round-trip actually ran
        # Same ran-assertion as the live lane: every test in the suite carries
        # a skipif on collector availability, so an image pull failure or a
        # renamed marker would otherwise skip the whole lane to green.
        run: |
          python scripts/assert_junit_ran.py otel-collector.xml \
            --expect-passed 4 \
            --require test_collector_accepts_metric \
            --require test_collector_accepts_log \
            --require test_collector_rejects_a_bare_resource_metrics_body \
            --require test_the_cli_reaches_the_collector_end_to_end

      # ------------------------------------------------------------------
      # LIVE LANE — the only place in this repo where a real brain executes.
      #
      # `test_image_ask_roundtrip` (Claude) and `test_image_codex_ask_roundtrip`
      # (Codex) run the image built above against an ephemeral event server
      # started from the real Worker sources, and each completes one real ask
      # round-trip. That is the product's core claim, and until #909 nothing in
      # CI proved it on either brain.
      #
      # It spends real model credits, so it is gated: nightly, manual dispatch,
      # or the `ci:live` label on a PR (the label trigger has been in this
      # workflow's `on:` block since the reorg; this is the step it was for).
      # ------------------------------------------------------------------
      - name: Decide whether the live lane runs
        id: live
        env:
          EVENT_NAME: ${{ github.event_name }}
          # '' on non-PR events; the fork's slug on a fork PR.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          HAS_LIVE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:live') }}
        run: |
          set -euo pipefail
          run=false
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              run=true ;;
            pull_request)
              # Provably inert on fork PRs. GitHub already withholds secrets
              # from `pull_request` runs on forks, which would make the lane
              # fail rather than leak — but failing a contributor's PR for a
              # credential they cannot have is its own bug, so refuse by
              # identity and say why. This workflow never uses
              # `pull_request_target`, which is what would actually hand a
              # fork's code the repo's secrets.
              if [ "$PR_HEAD_REPO" != "$THIS_REPO" ]; then
                echo "fork PR ($PR_HEAD_REPO) — live lane is inert"
              elif [ "$HAS_LIVE_LABEL" = "true" ]; then
                run=true
              else
                echo "no ci:live label — live lane is inert"
              fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "live lane runs: $run (event=$EVENT_NAME)"

      - name: Fail fast when the live credentials are missing
        # Ran-assertion, layer (i). Both round-trips `skipif` on an absent key,
        # so a renamed/rotated/never-added secret would skip both and exit 0.
        # Catch the common case here, loudly, before spending a brain call.
        if: steps.live.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ANTHROPIC_API_KEY:-}" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "${OPENAI_API_KEY:-}" ] || missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::live lane cannot run — missing repo secret(s):$missing" >&2
            exit 1
          fi
          echo "both live credentials are present"

      # NODE 22, replacing the 20 pinned at the top of this job — deliberate,
      # and it must come AFTER the wheel build. wrangler refuses to start below
      # v22, while hatch_build.py's non-editable wheel build requires EXACTLY
      # 20 (`_require_build_node`). Nothing below builds a wheel, so the swap
      # is safe here and only here. See the same note in ci.yml's `wrangler` job.
      - uses: actions/setup-node@v4
        if: steps.live.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: event-server/package-lock.json

      - name: Install the wrangler harness
        # `_start_wrangler_server` runs the real Worker under `wrangler dev` in
        # local mode — no Cloudflare account or credentials involved. Without
        # this, `_has_wrangler()` is false and both round-trips SKIP.
        if: steps.live.outputs.run == 'true'
        working-directory: event-server
        run: npm ci --no-audit --no-fund

      - name: Run the live brain round-trips (Claude + Codex)
        if: steps.live.outputs.run == 'true'
        env:
          BOBI_TEST_IMAGE: bobi:ci
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/integration/test_container_image.py \
            -m "docker and live" -v --timeout=700 \
            --junitxml=live-roundtrips.xml

      - name: Assert the live round-trips actually ran
        # Ran-assertion, layer (ii). Layer (i) catches an absent secret; this
        # catches every other way the lane can skip to green — the Linux guard,
        # an unavailable wrangler harness, a marker expression that stopped
        # matching. Counts come from the junit XML, never from `-rA` prose.
        if: steps.live.outputs.run == 'true'
        run: |
          python scripts/assert_junit_ran.py live-roundtrips.xml \
            --expect-passed 2 \
            --require test_image_ask_roundtrip \
            --require test_image_codex_ask_roundtrip
