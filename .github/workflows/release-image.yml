name: Release base image

# #930: publish candidates first; only the trusted fleet callback promotes the
# exact proven digest. PyPI publication remains independent of the fleet.
on:
  repository_dispatch:
    types: [bobi-image-proven-v1]
  workflow_call:
    inputs:
      version:
        description: "Published PyPI version to build as a candidate"
        required: true
        type: string
      claude-version:
        description: "Exact Claude CLI pin resolved by the release"
        required: true
        type: string
      source-sha:
        description: "Public release commit; resolved from the release tag if omitted"
        required: false
        type: string
      dry-run:
        description: "Build locally without publishing a candidate or requesting a canary"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Published PyPI version to build as a candidate"
        required: true
        type: string
      claude-version:
        description: "Exact Claude CLI pin resolved by the release"
        required: true
        type: string
      source-sha:
        description: "Public release commit; resolved from the release tag if omitted"
        required: false
        type: string
      dry-run:
        description: "Build locally without publishing a candidate or requesting a canary"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  IMAGE: ghcr.io/moda-labs/bobi

jobs:
  prepare:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      claude-version: ${{ steps.prepare.outputs.claude-version }}
      source-sha: ${{ steps.prepare.outputs.source-sha }}
      previous-digest: ${{ steps.prepare.outputs.previous-digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate the release and record the current final digest
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CLAUDE_VERSION: ${{ inputs.claude-version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: python3 scripts/release_image.py prepare

  build-candidate:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Ensure a Docker daemon
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "docker daemon already available"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          # The runner user's fresh group membership can't apply to this
          # already-running session; the socket is ephemeral to this VM.
          sudo chmod 666 /var/run/docker.sock
          docker info >/dev/null

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for candidate publication
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ !inputs.dry-run }}
          load: ${{ inputs.dry-run }}
          build-args: |
            BOBI_BUILD=pypi
            BOBI_VERSION=${{ needs.prepare.outputs.version }}
            CLAUDE_VERSION=${{ needs.prepare.outputs.claude-version }}
          cache-from: type=gha,scope=base-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-image-${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
            org.opencontainers.image.source=https://github.com/moda-labs/bobi-agent
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      - name: Check native image tools and retain its digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CLAUDE_VERSION: ${{ needs.prepare.outputs.claude-version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          if [ "$DRY_RUN" = true ]; then
            ref="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          fi
          docker run --rm --entrypoint bobi "$ref" --version | grep -Fx "bobi, version $VERSION"
          docker run --rm --entrypoint claude "$ref" --version | grep -F "$CLAUDE_VERSION "
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${ARCH}.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry-run }}
        with:
          name: candidate-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          retention-days: 30
          if-no-files-found: error

  assemble-candidate:
    needs: [prepare, build-candidate]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      artifact-id: ${{ steps.record.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CLAUDE_VERSION: ${{ needs.prepare.outputs.claude-version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      PREVIOUS_DIGEST: ${{ needs.prepare.outputs.previous-digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the candidate from immutable platform digests
        run: |
          set -euo pipefail
          amd64="$(cat digests/amd64.txt)"
          arm64="$(cat digests/arm64.txt)"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            -t "${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          python3 scripts/release_image.py collect
      - uses: actions/upload-artifact@v4
        id: record
        with:
          name: image-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.json
          retention-days: 30
          if-no-files-found: error

  request-canary:
    needs: [assemble-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request proof of this candidate
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          ARTIFACT_ID: ${{ needs.assemble-candidate.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::CROSS_REPO_PAT is required"; exit 1; }
          jq -n --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson artifact "$ARTIFACT_ID" \
            '{event_type:"bobi-image-candidate-v1",client_payload:{schema_version:1,producer_run_id:$run,producer_run_attempt:$attempt,candidate_artifact_id:$artifact}}' \
            > "$RUNNER_TEMP/candidate-dispatch.json"
          gh api repos/moda-labs/moda-agents/dispatches --input "$RUNNER_TEMP/candidate-dispatch.json"
          echo "Candidate ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} requested; final tags await the fleet proof callback." >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: bobi-final-image-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      # repository_dispatch uses the default branch, never a payload-selected ref.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate callback schema and target
        run: python3 scripts/release_image.py check-event
      - name: Verify the completed canary and promote its exact digest
        env:
          GH_TOKEN: ${{ github.token }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/release_image.py promote
